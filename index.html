<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background-color: #0b3d02; /* Dark Forest Green */
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-family: 'Pacifico', cursive;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            position: relative;
            font-family: 'Poppins', sans-serif;
        }
        #yes {
            background-color: white;
            color: black;
        }
        #no {
            background-color: black;
            color: white;
        }
        .message {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .cat-gif {
            width: 200px;
            height: auto;
            margin-bottom: 10px;
        }
        .note {
            margin-top: 10px;
            font-size: 16px;
            font-style: italic;
            color: white;
        }
    </style>
</head>
<body>
    <img class="cat-gif" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnM1NnU4Mm12dWd2cm9hMmhvNmJuMWYwZXBtcWdyZmx1eG8zdmtscSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/kfRKF0iqA8jyDqq1nH/giphy.gif" alt="Cute Cat">
    <div class="message">I made the background dark green cuz someone told me it's ur fav colour hihi</div>
    <div class="container">
        <h1>Will you be my Valentine? :3 <3</h1>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>

    <script>
        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");

        noButton.addEventListener("mouseover", function() {
            let x = Math.random() * 200 - 100;
            let y = Math.random() * 200 - 100;
            noButton.style.transform = `translate(${x}px, ${y}px)`;
        });

        yesButton.addEventListener("click", function() {
            document.body.innerHTML = `<h1>YIPPIEEEEE</h1><img src='https://media.giphy.com/media/UMon0fuimoAN9ueUNP/giphy.gif?cid=790b7611bnm4yo69nifmm5fljo500e9982zq3ul54o0qltsr&ep=v1_stickers_search&rid=giphy.gif&ct=s'><div class='note'>-from an introverted nerd (a really shy one) xoxo</div>`;
        });
    </script>
</body>
</html>
